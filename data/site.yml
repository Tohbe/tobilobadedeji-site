    - { name: Python, logo: /images/uploads/python-logo.jpg, level: Working }
    - { name: Google Analytics, logo: /images/uploads/google-analytics.png, level: Proficient }
    - { name: AI-Assisted Analysis, logo: /images/uploads/ai-logo.jpg, level: Proficient }
