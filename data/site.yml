      description: >-
        An interactive HR analytics solution designed to transform raw employee
        data into clear, decision-ready insights. Built as a reusable Excel
        template enabling HR professionals to quickly analyze workforce
        composition, compensation patterns, and key people metrics.
      image: /images/uploads/screenshot-14-.png
      featured: true
      link: ""
