      description: >-
        An interactive sales dashboard built for evidence-based business
        strategy, surfacing total sales, profit trends, customer insights, and
        top-performing products in a clean, decision-ready format.
      image: /images/uploads/aurum.png
      featured: true
      link: ""
      tools:
