work:
  headline: Data Analytics & Operations Professional
  tagline: >-
    Where data meets systems and decisions, building frameworks that help
    institutions and people grow.
  bio_1: >-
    I work at the intersection of data, systems, and execution. With a
    background in program and operations management, I transitioned into data
    analytics after recognizing that the teams that move fastest and smartest
    are the ones that see their data clearly and design systems intentionally.
  bio_2: >-
    My approach treats data not as a report card, but as a compass, helping
    organizations ask better questions, allocate resources wisely, and act with
    confidence.
  domains:
    - name: Higher Education
    - name: Tech Startups
    - name: HR Analytics
    - name: Operations
    - name: Business Simulations
  tools:
